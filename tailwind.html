<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coffee card</title>
     <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#3b2418]">
 <div class="w-80 bg-[beige] rounded-2xl overflow-hidden shadow-lg">
  <img src="photo.png" 
  class="w-full h-100 object-cover">
  <div class="p-5">
    <h2 class="text-2xl font-bold text-[black] mb-2">Caramel Latte</h2>
    <p class="text-gray-500 text-sm leading-6 mb-5">
      Cream latte with a rich Caramel flavour and a smooth coffee finish
    </p>
    <div class="flex items-center justify-between">
      <span class="text-xl font-bold text-brown">₹199</span>
      <button class="bg-black text-white px-5 py-2 rounded-full hover:bg-amber-500
       transition duration-300">
       Order now
      </button>
    </div>
  </div>
 </div>  
</body>
</html>
